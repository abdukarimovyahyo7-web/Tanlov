<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#180d33" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#5500aa" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.5" />

  <!-- Cyber grid lines in background -->
  <path d="M50 380 L462 380 M50 420 L462 420 M120 380 L80 460 M200 380 L180 460 M280 380 L280 460 M360 380 L380 460 M440 380 L480 460" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Left building (Purple) -->
  <rect x="110" y="210" width="70" height="170" rx="6" fill="url(#purpleGrad)" filter="url(#glow)" />
  <!-- Windows -->
  <circle cx="130" cy="240" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="160" cy="240" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="130" cy="270" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="160" cy="270" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="130" cy="300" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="160" cy="300" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="130" cy="330" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="160" cy="330" r="5" fill="#ffffff" opacity="0.9" />

  <!-- Center Skyscraper (Cyan 100-floor tower) -->
  <rect x="200" y="120" width="112" height="260" rx="8" fill="url(#cyanGrad)" filter="url(#glow)" />
  <!-- Spire & Antenna -->
  <line x1="256" y1="65" x2="256" y2="120" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="60" r="8" fill="#ffd700" filter="url(#glow)" />
  <!-- Skyscraper Windows grid -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="216" y="145" width="16" height="10" rx="2" fill="#ffd700" />
    <rect x="248" y="145" width="16" height="10" rx="2" />
    <rect x="280" y="145" width="16" height="10" rx="2" fill="#00f0ff" />

    <rect x="216" y="175" width="16" height="10" rx="2" />
    <rect x="248" y="175" width="16" height="10" rx="2" fill="#ffd700" />
    <rect x="280" y="175" width="16" height="10" rx="2" />

    <rect x="216" y="205" width="16" height="10" rx="2" fill="#00f0ff" />
    <rect x="248" y="205" width="16" height="10" rx="2" />
    <rect x="280" y="205" width="16" height="10" rx="2" fill="#ffd700" />

    <rect x="216" y="235" width="16" height="10" rx="2" />
    <rect x="248" y="235" width="16" height="10" rx="2" fill="#00f0ff" />
    <rect x="280" y="235" width="16" height="10" rx="2" />

    <rect x="216" y="265" width="16" height="10" rx="2" fill="#ffd700" />
    <rect x="248" y="265" width="16" height="10" rx="2" />
    <rect x="280" y="265" width="16" height="10" rx="2" fill="#00f0ff" />

    <rect x="216" y="295" width="16" height="10" rx="2" />
    <rect x="248" y="295" width="16" height="10" rx="2" fill="#ffd700" />
    <rect x="280" y="295" width="16" height="10" rx="2" />

    <rect x="216" y="325" width="16" height="10" rx="2" fill="#00f0ff" />
    <rect x="248" y="325" width="16" height="10" rx="2" />
    <rect x="280" y="325" width="16" height="10" rx="2" fill="#ffd700" />
  </g>

  <!-- Right building (Indigo/Purple) -->
  <rect x="332" y="170" width="80" height="210" rx="6" fill="url(#purpleGrad)" filter="url(#glow)" />
  <circle cx="355" cy="200" r="5" fill="#ffd700" opacity="0.9" />
  <circle cx="385" cy="200" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="355" cy="235" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="385" cy="235" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="355" cy="270" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="385" cy="270" r="5" fill="#ffd700" opacity="0.9" />
  <circle cx="355" cy="305" r="5" fill="#00f0ff" opacity="0.9" />
  <circle cx="385" cy="305" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="355" cy="340" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="385" cy="340" r="5" fill="#00f0ff" opacity="0.9" />

  <!-- Hokim Crown Icon on Top -->
  <path d="M226 100 L241 115 L256 95 L271 115 L286 100 L280 125 L232 125 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Bottom Brand Text -->
  <text x="256" y="435" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">
    TANLOV MAHALLASI
  </text>
  <text x="256" y="465" text-anchor="middle" font-family="monospace" font-weight="700" font-size="18" fill="#00f0ff" letter-spacing="6">
    3D CITY BUILDER
  </text>
</svg>
